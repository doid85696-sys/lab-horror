name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build mod
        run: |
          for i in 1 2 3 4; do
            gradle build --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in 45s..."
            sleep 45
          done
          exit 1

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: horrorlab-mod
          path: build/libs/*.jar
          if-no-files-found: error
